<!DOCTYPE html>

    <head>
        <link rel="stylesheet" type="text/css" href=""></link>
        <style> /* move all of this to an external style sheet that the loss/win page can then copy over */
            body {margin: 0; display: flex; flex-direction: column; height: 100vh;}
            table {border: 1px solid; width: 500px; height: 500px; align-items: center;}
            .game {display: flex; justify-content: center; align-items: flex-start; text-align: center; flex-direction: row; flex-grow: 1; gap: 20px; padding-top: 25px;}
            .table {display: flex; justify-content: center; align-items: center;} 
            .table td {border: 1px solid;}
            header {display: flex; align-items: center; justify-content: center; padding: 10px; border-bottom: 2px solid;}
            .btn1 {width: 150px; height: 60px; border: 1px solid;}
            .btn2 {width: 75px; height: 60px; border: 1px solid;}
            .right-header {display: flex; justify-content: flex-end; gap: 10px;}
            #name {flex: 2; text-align: center; font-size: 48px; font-weight: bold;} /* !! placeholder in case we wanna do something with this */
            #give-up {width: 80px; height: 80px; font-size: 16px;}
            .scores {display: block;}
            .side-column-table {width: 150px; height: 500px; border-style: hidden;} 
            .side-column {flex: 1; display: flex; flex-direction: column; justify-content: center;}
            #left-conditions {align-items: flex-end; padding-top: 100px;}
            #extra {align-items: flex-start; padding-top: 100px;}
            .center-elements {display: flex; flex-direction: column; align-items: center; justify-content: flex-start;}
            .top-row-table {width: 500px; height: 100px; table-layout: fixed; border-style: hidden;}
            .top-row-table td {width: 33.33%; text-align: center;}
        </style>

        <title> MineDoku </title>
