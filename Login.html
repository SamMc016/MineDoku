<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, cyan, lightblue);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid white;
            outline: black;
        }

        input:focus {
            border-color: lightgray;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .go-btn {
            background: lightskyblue;
            color: limegreen;
        }

        .go-btn:hover {
            background: mediumblue;
        }

        .back-btn {
            background: lightskyblue;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: mediumblue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login / Signup</h2>

    <form action="#">
        <input type="text" placeholder="Username" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>

        <button type="submit" class="btn go-btn">Go</button>
    </form>

    <button class="btn back-btn" onclick="goBack()">Back to Puzzle</button>
</div>

<script>
    function goBack() {
        window.location.href = "MainPage.html"; // change to your puzzle page
    }
</script>

</body>
</html>
