<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.1">
    <title>Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
</head>

<body class="min-h-screen flex flex-col bg-cover bg-center bg-fixed">

    <!-- HEADER -->
    <header class="top-bar">
        <button class="btn" onclick="window.location.href='{{ url_for('main.index') }}'">
            Back to Game
        </button>

        <h1 class="page-title">MINEDOKU</h1>

        <div class="right-header">

            <button class="btn"
                    onclick="window.location.href='{{ url_for('main.friends') }}'">
                Friends
            </button>
        
            <button class="btn"
                    onclick="window.location.href='{{ url_for('main.logout') }}'">
                Logout
            </button>
        
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="flex flex-col items-center justify-center flex-1 px-6 pb-28">
        <h2 class="!text-4xl font-bold mb-4 text-white">
            Inventory
        </h2>

        <div class="backdrop-blur-md bg-white/20 border border-white/30 rounded-xl p-8 shadow-xl">
            <div id="accounts_inventory" class="grid grid-cols-9 gap-4">

                {% for block in blocks %}
                    <div class="account-slot"
                         data-unlocked="{% if block.block_id in unlocked_block_ids %}true{% else %}false{% endif %}"
                         data-texture="{{ url_for('static', filename=block.inv_texture_path) }}">
            
                        <img class="account-slot-image"
                             src="{% if block.block_id in unlocked_block_ids %}{{ url_for('static', filename=block.inv_texture_path) }}{% else %}{{ url_for('static', filename='assets/blank_texture.png') }}{% endif %}"
                             alt="{{ block.block_name }}">
            
                    </div>
                {% endfor %}
            
            </div>
        </div>
    </div>

    <!-- STATS BAR -->
    <div class="fixed bottom-0 left-0 w-full backdrop-blur-md bg-white/20 border-t border-white/30 p-6">
        <div class="flex justify-center gap-16 text-white font-semibold">

            <div>Games Played: --</div>
            <div>Games Won: --</div>
            <div>Lowest US: --</div>
            <div>Avg US: --</div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/account.js') }}"></script>

</body>

</html>
