<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.1">
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
    <title>MineDoku - End Game</title>
</head>

<body>

    <header class="top-bar">

        <button class="btn" onclick="window.location.href='{{ url_for('index') }}'">
            ← Back to Game
        </button>

        <h1 class="page-title">MINEDOKU</h1>

        <div class="right-header">
            <button class="btn" id="rules">Friends</button>
        </div>

    </header>

    <!-- NEW BUTTON ROW -->
    <div class="flex justify-center gap-8 mt-6">

        <button class="btn">
            Least Common
        </button>

        <button class="btn">
            Most Common
        </button>

    </div>

    <!-- SAME GAME LAYOUT -->
    <div class="game" style="padding-top: 0px;">

        <div class="side-column" id="left-conditions">

            <table class="side-column-table">
                <tr><td><p id="LTCon">Left Top Condition</p></td></tr>
                <tr><td><p id="LMCon">Left Middle Condition</p></td></tr>
                <tr><td><p id="LBCon">Left Bottom Condition</p></td></tr>
            </table>

        </div>

        <div class="center-elements">

            <div class="top-row">

                <table class="top-row-table">
                    <tr>
                        <td><p id="TLCon">Top Left Condition</p></td>
                        <td><p id="TMCon">Top Middle Condition</p></td>
                        <td><p id="TRCon">Top Right Condition</p></td>
                    </tr>
                </table>

            </div>

            <div class="table">

                <table>

                    <tr>
                        <td id="1" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img1.jpg') }}" alt="">
                        </td>

                        <td id="2" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img2.jpg') }}" alt="">
                        </td>

                        <td id="3" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img3.jpg') }}" alt="">
                        </td>
                    </tr>

                    <tr>
                        <td id="4" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img4.jpg') }}" alt="">
                        </td>

                        <td id="5" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img5.jpg') }}" alt="">
                        </td>

                        <td id="6" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img6.jpg') }}" alt="">
                        </td>
                    </tr>

                    <tr>
                        <td id="7" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img7.jpg') }}" alt="">
                        </td>

                        <td id="8" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img8.jpg') }}" alt="">
                        </td>

                        <td id="9" class="gameboard-cell">
                            <img src="{{ url_for('static', filename='images/img9.jpg') }}" alt="">
                        </td>
                    </tr>

                </table>

            </div>

        </div>

        <div class="side-column" id="extra">

            <table class="side-column-table">

                <tr>
                    <td>
                        <p id="dur">Durability <span class="scores">9/9</span></p>
                    </td>
                </tr>

                <tr>
                    <td><button id="give-up">Play Again?</button></td>
                </tr>

                <tr>
                    <td>
                        <p id="US">US <span class="scores">1000</span></p>
                    </td>
                </tr>

            </table>

        </div>

    </div>

</body>
</html>
