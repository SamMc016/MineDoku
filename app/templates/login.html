{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block left_button %}
<button class="btn" onclick="window.location.href='{{ url_for('main.index') }}'">
    Back to Game
</button>
{% endblock %}

{% block right_button %}
<div class="header-spacer"></div>
{% endblock %}

{% block content %}
<div class="login-wrapper">

    <div class="login-panel">

        <h2 class="login-title">
            Login
        </h2>

        <form method="POST" class="login-form">

            {{ form.hidden_tag() }}

            <input type="text" name="username" placeholder="Username or Email" required class="login-input">

            <input type="password" name="password" placeholder="Password" required class="login-input">

            <button type="submit" class="login-submit">
                Go
            </button>

        </form>

        <p class="login-footer">
            Don't have an account?

            <a href="{{ url_for('main.signup') }}" class="login-link">
                Sign up!
            </a>
        </p>

    </div>

</div>
{% endblock %}
