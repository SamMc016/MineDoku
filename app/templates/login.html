<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.1">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
</head>

<body class="login-page">

    <!-- HEADER -->
    <header class="top-bar">
        <button class="btn" onclick="window.location.href='{{ url_for('main.index') }}'">
            Back to Game
        </button>

        <h1 class="page-title">MINEDOKU</h1>

        <div class="header-spacer"></div>
    </header>

    <!-- LOGIN CONTENT -->
    <div class="login-wrapper">

        <div class="login-panel">

            <h2 class="login-title">
                Login
            </h2>

            <form method="POST" class="login-form">
                
                {{ form.hidden_tag() }}

                <input type="text"
                       name="username"
                       placeholder="Username or Email"
                       required
                       class="login-input">
            
                <input type="password"
                       name="password"
                       placeholder="Password"
                       required
                       class="login-input">
            
                <button type="submit" class="login-submit">
                    Go
                </button>
            
            </form>

            <p class="login-footer">
                Don't have an account?

                <a href="{{ url_for('main.signup') }}" class="login-link">
                    Sign up!
                </a>
            </p>

        </div>

    </div>

</body>

</html>
