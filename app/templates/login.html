<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.1">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
</head>

<body class="min-h-screen flex flex-col bg-cover bg-center bg-fixed"
    style="background-image: url('{{ url_for('static', filename='assets/background_image.jpg') }}');">

    <!-- HEADER -->
    <header class="top-bar">
        <button class="btn" onclick="window.location.href='{{ url_for('main.index') }}'">
            Back to Game
        </button>

        <h1 class="page-title">MINEDOKU</h1>

        <div class="w-[150px]"></div>
    </header>

    <!-- LOGIN CONTENT -->
    <div class="flex flex-1 items-center justify-center px-6">

        <div class="backdrop-blur-md bg-white/20 border border-white/30 rounded-xl p-10 shadow-xl w-full max-w-md">

            <h2 class="!text-5xl font-bold text-center text-white mb-8">
                Login
            </h2>

            <form action="#" class="space-y-5">

                <input type="text" placeholder="Username" required
                    class="w-full px-4 py-3 rounded-lg bg-black/30 border border-white/30 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white">

                <input type="password" placeholder="Password" required
                    class="w-full px-4 py-3 rounded-lg bg-black/30 border border-white/30 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white">

                <button type="submit"
                    class="w-full py-3 rounded-lg bg-white/20 border border-white/30 hover:bg-white/30 transition text-white font-bold">
                    Go
                </button>

            </form>

            <p class="text-center mt-6 text-white">
                Don't have an account?
                <a href="{{ url_for('main.signup') }}" class="underline font-bold hover:text-gray-200 transition">
                    Sign up!
                </a>
            </p>

        </div>

    </div>

</body>

</html>
