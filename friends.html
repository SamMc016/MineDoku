<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Friends Page</title>
    <link rel="stylesheet" href="friends.css">
</head>
<body>

<!-- Top Navigation -->
<div class="top-bar">
    <button class="btn">← Back to Game</button>

    <h1 class="title">MINEDOKU</h1>

    <button class="btn">Account</button>
</div>

<div class="container">

    <!-- Friends List -->
    <div class="panel friends-panel">
        <h2>Friends</h2>
        <div class="friends-list">
            <div class="friend">Alice</div>
            <div class="friend">Bob</div>
            <div class="friend">Charlie</div>
            <div class="friend">Dana</div>
            <!-- Add more friends here -->
        </div>
    </div>

    <!-- Middle Section -->
    <div class="panel">

        <h2>Friends Leaderboard</h2>
        <div class="leaderboard-item">
            <span>Alice</span><span>1200</span>
        </div>
        <div class="leaderboard-item">
            <span>Bob</span><span>950</span>
        </div>
        <div class="leaderboard-item">
            <span>Charlie</span><span>870</span>
        </div>

        <h2>All-Time Leaderboard</h2>
        <div class="leaderboard-item">
            <span>ProGamer1</span><span>5000</span>
        </div>
        <div class="leaderboard-item">
            <span>SpeedKing</span><span>4800</span>
        </div>
        <div class="leaderboard-item">
            <span>LegendX</span><span>4500</span>
        </div>
    </div>

    <!-- Add Friends (RIGHT SIDE NOW) -->
    <div class="panel">
        <h2>Add Friend</h2>
        <div class="search-box">
            <input type="text" placeholder="Enter username...">
        </div>
        <button class="btn" style="margin-top:10px;">Send Request</button>
    </div>

</div>

</body>
</html>
