<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Page</title>

<style>
    body {
        font-family: "Minecraft"
    }
    body {
        margin: 0;
        height: 100vh;

        /* ✅ BACKGROUND GIF GOES HERE */
        background: url("file:///Users/hamsayusuf/Downloads/minegif.gif") no-repeat center center fixed;
        background-size: cover;

        font-family: 'Minecraft';
        color: white;
    }

    .main {
        display: flex;
        height: 100vh;
        padding: 20px;
        box-sizing: border-box;
        background: rgba(0,0,0,0.6); /* dark overlay */
    }

    /* LEFT PANEL */
    .left {
        width: 20%;
        border: 3px solid white;
        padding: 15px;
    }

    .left h3 {
        margin-bottom: 20px;
    }

    .left p {
        margin: 15px 0;
        cursor: pointer;
    }

    /* CENTER PANEL */
    .center {
        width: 60%;
        margin: 0 20px;
        border: 3px solid white;
        padding: 15px;
    }

    .inventory {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 20px;
    }

    .item {
        width: 150px;
        height: 150px;
        background: #555;
        border: 4px solid #000;
        box-shadow:
            inset -6px -6px grey,  
            inset 6px 6px white,   
            4px 4px 0px black;          
        
        image-rendering: pixelated;
}

    .item:hover {
        transform: scale(1.05);
        cursor: pointer;
    }

    .item:active {
        transform: scale(0.95);
    }

    .item.selected {
        border: 4px solid white;
        box-shadow:
            inset -6px -6px grey,
            inset 6px 6px white, 
            0 0 10px white;
    }

    /* RIGHT PANEL */
    .right {
        width: 20%;
        border: 3px solid ;
        padding: 15px;
    }

    .right p {
        margin: 15px 0;
    }

    /* TITLE */
    .title {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        border: 3px solid white;
        padding: 10px 20px;
        background: black;
    }

</style>
</head>

<body>

<div class="title">ACCOUNT</div>

<div class="main">

    <!-- LEFT PANEL -->
    <div class="left">
        <h3>Menu</h3>
        <p>Settings</p>
        <p>Saved</p>
        <p>Devices</p>
        <p>Log Out</p>
    </div>

    <!-- CENTER PANEL -->
    <div class="center">
        <h3>Inventory</h3>

        <div class="Inventory" id="Inventory"></div>

    <!-- RIGHT PANEL -->
    <div class="right">
        <h3>Stats</h3>
        <p>Games Played: </p>
        <p>Wins: </p>
        <p>Longest Streak: </p>
        <p>Level: </p>
    </div>

</div>

</body>

<script>
    const Inventory = document.getElementById('Inventory');

    // create 27 slots
    for (let i = 0; i < 27; i++) {
        const item = document.createElement('div');
        item.classList.add('item');
        Inventory.appendChild(item);
    }

    const items = document.querySelectorAll('.item');

    items.forEach(item => {
        item.addEventListener('click', () => {
            items.forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
        });
    });
</script>
</html>
